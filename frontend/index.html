<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会計データチェックシステム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: #f5f7fa; color: #333; }

    header {
      background: linear-gradient(135deg, #1a56db, #1e429f);
      color: white;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header .subtitle { font-size: 0.85rem; opacity: 0.8; margin-top: 2px; }

    .container { max-width: 960px; margin: 0 auto; padding: 32px 16px; }

    /* アップロードエリア */
    .upload-area {
      background: white;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: #1a56db;
      background: #eff6ff;
    }
    .upload-icon { font-size: 3rem; margin-bottom: 12px; }
    .upload-area h2 { font-size: 1.1rem; color: #1a56db; margin-bottom: 8px; }
    .upload-area p { font-size: 0.9rem; color: #6b7280; }
    #fileInput { display: none; }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: #1a56db; color: white; }
    .btn-primary:hover { background: #1e429f; }
    .btn-secondary { background: #e5e7eb; color: #374151; margin-left: 8px; }
    .btn-secondary:hover { background: #d1d5db; }

    /* サマリーカード */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .summary-card .count { font-size: 2.5rem; font-weight: 700; line-height: 1; }
    .summary-card .label { font-size: 0.85rem; color: #6b7280; margin-top: 6px; }
    .card-error .count { color: #dc2626; }
    .card-warning .count { color: #d97706; }
    .card-info .count { color: #2563eb; }
    .card-total .count { color: #059669; }

    /* フィルタータブ */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 2px solid transparent;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab.all { background: #f3f4f6; color: #374151; }
    .tab.error { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .tab.warning { background: #fffbeb; color: #d97706; border-color: #fde68a; }
    .tab.info { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
    .tab.active { font-weight: 700; border-width: 2px; }
    .tab.all.active { border-color: #9ca3af; }

    /* 指摘カード */
    .issue-list { display: flex; flex-direction: column; gap: 12px; }
    .issue-card {
      background: white;
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border-left: 4px solid;
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .issue-card.error { border-color: #dc2626; }
    .issue-card.warning { border-color: #f59e0b; }
    .issue-card.info { border-color: #3b82f6; }

    .issue-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
    .issue-body { flex: 1; }
    .issue-header {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-error { background: #fef2f2; color: #dc2626; }
    .badge-warning { background: #fffbeb; color: #d97706; }
    .badge-info { background: #eff6ff; color: #2563eb; }
    .badge-category { background: #f3f4f6; color: #374151; }
    .badge-account { background: #f0fdf4; color: #166534; }
    .badge-month { background: #faf5ff; color: #6b21a8; }

    .issue-message { font-size: 0.92rem; line-height: 1.6; color: #374151; }

    /* ローディング */
    .loading {
      text-align: center;
      padding: 48px;
      display: none;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .meta-info {
      background: white;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      color: #6b7280;
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .meta-info span strong { color: #374151; }

    .empty-state {
      text-align: center;
      padding: 64px 32px;
      color: #9ca3af;
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }

    #results { display: none; }
  </style>
</head>
<body>

<header>
  <div>📊</div>
  <div>
    <h1>会計データチェックシステム</h1>
    <div class="subtitle">BS・PL・消費税の自動チェック | 弥生・freee・MoneyForward 対応</div>
  </div>
</header>

<div class="container">

  <!-- アップロードエリア -->
  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon">📂</div>
    <h2>CSVファイルをドロップ、またはクリックして選択</h2>
    <p>弥生会計 / freee / MoneyForward のエクスポートCSVに対応</p>
    <p style="margin-top:16px;">
      <button class="btn btn-primary" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">ファイルを選択</button>
      <button class="btn btn-secondary" onclick="event.stopPropagation(); runSample()">サンプルデータで試す</button>
    </p>
    <input type="file" id="fileInput" accept=".csv" onchange="handleFile(this.files[0])">
  </div>

  <!-- ローディング -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>チェック中...</p>
  </div>

  <!-- 結果エリア -->
  <div id="results">
    <div class="meta-info" id="metaInfo"></div>

    <div class="summary-grid" id="summaryGrid"></div>

    <div class="filter-tabs" id="filterTabs"></div>

    <div class="issue-list" id="issueList"></div>
  </div>

</div>

<script>
  const uploadArea = document.getElementById('uploadArea');

  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  async function handleFile(file) {
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    showLoading();
    try {
      const res = await fetch('/api/check', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'エラーが発生しました');
      renderResults(data);
    } catch (e) {
      alert('エラー: ' + e.message);
      hideLoading();
    }
  }

  async function runSample() {
    showLoading();
    try {
      const res = await fetch('/api/sample');
      const data = await res.json();
      renderResults(data);
    } catch (e) {
      alert('エラー: ' + e.message);
      hideLoading();
    }
  }

  function showLoading() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('results').style.display = 'none';
  }

  function hideLoading() {
    document.getElementById('loading').style.display = 'none';
  }

  function renderResults(data) {
    hideLoading();
    const { summary, issues } = data;

    // メタ情報
    document.getElementById('metaInfo').innerHTML = `
      <span>📁 <strong>${summary.software}</strong></span>
      <span>📅 期間: <strong>${summary.date_range.start} ～ ${summary.date_range.end}</strong></span>
      <span>📋 仕訳件数: <strong>${summary.total_entries.toLocaleString()}件</strong></span>
    `;

    // サマリーカード
    document.getElementById('summaryGrid').innerHTML = `
      <div class="summary-card card-error">
        <div class="count">${summary.error}</div>
        <div class="label">🔴 要修正</div>
      </div>
      <div class="summary-card card-warning">
        <div class="count">${summary.warning}</div>
        <div class="label">🟡 要確認</div>
      </div>
      <div class="summary-card card-info">
        <div class="count">${summary.info}</div>
        <div class="label">🔵 提案・確認</div>
      </div>
      <div class="summary-card card-total">
        <div class="count">${summary.error + summary.warning + summary.info}</div>
        <div class="label">📊 指摘合計</div>
      </div>
    `;

    // フィルタータブ
    document.getElementById('filterTabs').innerHTML = `
      <div class="tab all active" onclick="filterIssues('all', this)">すべて</div>
      <div class="tab error" onclick="filterIssues('error', this)">🔴 要修正 (${summary.error})</div>
      <div class="tab warning" onclick="filterIssues('warning', this)">🟡 要確認 (${summary.warning})</div>
      <div class="tab info" onclick="filterIssues('info', this)">🔵 提案 (${summary.info})</div>
    `;

    // 指摘リスト
    window._allIssues = issues;
    renderIssues(issues);

    document.getElementById('results').style.display = 'block';
  }

  function renderIssues(issues) {
    const icons = { error: '🔴', warning: '🟡', info: '🔵' };
    const labels = { error: '要修正', warning: '要確認', info: '提案' };

    if (issues.length === 0) {
      document.getElementById('issueList').innerHTML = `
        <div class="empty-state">
          <div class="icon">✅</div>
          <p>このカテゴリの指摘はありません</p>
        </div>`;
      return;
    }

    document.getElementById('issueList').innerHTML = issues.map(issue => `
      <div class="issue-card ${issue.level}">
        <div class="issue-icon">${icons[issue.level]}</div>
        <div class="issue-body">
          <div class="issue-header">
            <span class="badge badge-${issue.level}">${labels[issue.level]}</span>
            <span class="badge badge-category">${issue.category}</span>
            <span class="badge badge-account">${issue.account}</span>
            <span class="badge badge-month">${issue.month}</span>
          </div>
          <div class="issue-message">${issue.message}</div>
        </div>
      </div>
    `).join('');
  }

  function filterIssues(level, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const filtered = level === 'all' ? window._allIssues : window._allIssues.filter(i => i.level === level);
    renderIssues(filtered);
  }
</script>
</body>
</html>
