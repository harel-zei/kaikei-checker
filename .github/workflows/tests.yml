name: tests

on:
  push:
    branches: [main, "deploy/**"]
  pull_request:

jobs:
  # 本番と同じ依存で、アプリ起動・API・E2Eまで含めた全テストを実行する
  full:
    name: 全テスト（本番同等の依存）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install production dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.4
      - name: Run all tests
        run: pytest -q
      - name: Verify the app actually boots
        working-directory: backend
        run: python -c "import main; print('boot OK:', len(main.app.routes), 'routes')"

  # 依存の宣言漏れを検知するため、最小構成でも通ることを確認する
  # （requirements.txt に無いライブラリへ依存すると本番で落ちるため）
  minimal:
    name: 最小依存（宣言漏れの検知）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal dependencies
        run: pip install pandas==2.2.3 numpy==2.1.3 pytest==8.3.4 requests==2.32.3 python-dotenv==1.0.1
      - name: Run checker tests
        # fastapi 等が無い環境ではアプリ統合テストはスキップされる
        run: pytest -q
